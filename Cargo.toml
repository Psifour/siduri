[package]
name = "siduri"
version = "0.0.1"
edition = "2024"
authors = ["psifour"]
license = "MIT OR Apache-2.0"
description = "Password manager on the gilgamesh vault: logins, TOTP, and a generator"
readme = "README.md"
autotests = false

[dependencies]
anyhow = { version = "1.0.98", features = ["backtrace"] }
clap = { version = "4.5.36", features = ["derive", "env"] }
getrandom = "0.3.2"
gilgamesh = { git = "https://github.com/psifour/gilgamesh" }
hmac = "0.12.1"
rpassword = "7.3.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha1 = "0.10.6"
zeroize = { version = "1.8.1", features = ["derive"] }

[dev-dependencies]
tempfile = "3.19.1"

[features]
# Pass hardware backends through to gilgamesh for direct (agent-less) unlock
# of hardware-bound vaults.
sep = ["gilgamesh/sep"]
tpm = ["gilgamesh/tpm"]

[[bin]]
name = "siduri"
path = "src/bin/main.rs"

[lib]
name = "siduri"
path = "src/lib.rs"

[[test]]
name = "integration"
path = "tests/lib.rs"
